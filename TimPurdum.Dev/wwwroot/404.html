<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found - Tim Purdum's Blog</title>
    <meta name="robots" content="noindex" />
    <base href="/" />
    <script>
        // Admin deep links, handled before anything else. GitHub Pages serves this file for ANY
        // unmatched path on the site, including /admin/* — and the admin is a separate Blazor WASM
        // app staged under /admin/, so its routes are never real files. Stash the requested path
        // and bounce to /admin/, where admin-interop.js restores it via history.replaceState
        // before the admin's router boots. Contract documented in the BlogGenerator.Admin ReadMe
        // ("Hosting under a sub-path"); the storage key must stay in sync with it.
        //
        // This runs in <head>, ahead of the public-site redirect logic at the bottom of <body>,
        // so the navigation aborts this document load before any markup paints or the public
        // Blazor app boots.
        (function () {
            var MOUNT = "/admin/";
            var path = window.location.pathname || "/";
            // Deeper than the mount point, or the bare "/admin" that just needs a trailing slash.
            // Reaching exactly "/admin/" here means the admin app isn't deployed (its index.html
            // would have been served instead) — bouncing would redirect to itself forever, so fall
            // through to the public 404 below. That keeps this safe to ship before the CI workflow
            // starts staging the admin, and turns a missing admin into a 404 rather than a hang.
            if (path === MOUNT) { return; }
            if (path.indexOf(MOUNT) !== 0 && path !== "/admin") { return; }
            try {
                sessionStorage.setItem("admin.spa.redirect",
                    path + window.location.search + window.location.hash);
            } catch (e) { /* private mode: the bounce still lands on the dashboard */ }
            window.location.replace("/admin/");
        })();
    </script>
    <link rel="stylesheet" href="css/app.css" />
    <link href="TimPurdum.Dev.styles.css" rel="stylesheet" />
</head>

<body>
    <main class="page-content" aria-label="content">
        <div class="wrapper">
            <article class="page">
                <!--
                    GitHub Pages serves this file for any unmatched path. Booting Blazor
                    WASM lets the NotFoundRedirect component normalize the URL (e.g. strip
                    zero-padded month/day segments: /post/2026/06/02/... -> /post/2026/6/2/...)
                    and redirect when the corrected page actually exists. The markup below is
                    shown until the runtime hydrates, and remains if no corrected page is found.
                -->
                <div id="not-found-redirect">
                    <header class="page-heading">
                        <h1 class="page-title">Page Not Found</h1>
                    </header>
                    <div class="page-content">
                        <p>Sorry, that page doesn't exist. Head back to the <a href="/">home page</a>.</p>
                    </div>
                </div>
            </article>
        </div>
    </main>
    <script>
        // Fast path (no WASM download): the common breakage is zero-padded month/day
        // segments (/post/2026/06/02/... vs the generated /post/2026/6/2/...). Normalize,
        // confirm the corrected page exists, then redirect — before the Blazor runtime
        // would even load. Only if that can't resolve do we boot Blazor, letting the
        // NotFoundRedirect component attempt a richer repair (slug match) or show the message.
        (function () {
            var path = location.pathname;
            var normalized = path.replace(/\/0+(\d+)(?=\/)/g, "/$1");

            function bootBlazor() {
                var s = document.createElement("script");
                s.src = "_framework/blazor.webassembly.js";
                document.body.appendChild(s);
            }

            if (normalized === path) {
                bootBlazor();
                return;
            }

            fetch(normalized, { method: "HEAD" })
                .then(function (r) {
                    if (r.ok) {
                        location.replace(normalized + location.search + location.hash);
                    } else {
                        bootBlazor();
                    }
                })
                .catch(bootBlazor);
        })();
    </script>
</body>

</html>
