# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages
env:
  PUBLISH_DIR: TimPurdum.Dev/bin/Release/net10.0/publish/wwwroot

on:
  # Runs on pushes targeting the default branch for the app's folder path
  push:
    branches:
      - main
      - reset

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Get latest .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
          
      - name: Build Source Project
        run: |
          cd TimPurdum.Dev.Source
          dotnet build -c Release

      - name: Copy AppSettings
        shell: pwsh
        run: |
          $appSettings = "${{ secrets.APP_SETTINGS }}"
          $appSettings | Out-File -FilePath ./TimPurdum.Dev/wwwroot/appsettings.json -Encoding utf8
          
      - name: Generate Static Pages
        run: |
          cd BlogGenerator/TimPurdum.Dev.BlogGenerator.Compiler
          dotnet run -c Release
          
      - name: Publish app
        run: |
          cd TimPurdum.Dev
          dotnet publish -c Release

      # The admin portal is a separate Blazor WASM app that ships alongside the public site under
      # /admin/. Its output only changes when the shell or the BlogGenerator.Admin RCL does — every
      # content-only commit (a new post, an edited page) leaves it untouched — so cache the publish
      # output and skip a full second WASM publish (~30-60s on a cold runner) on those pushes.
      #
      # The key covers both halves of what the bundle is built from: the shell AND the RCL source in
      # the submodule. Hashing only the shell would serve a stale admin whenever the RCL changes but
      # the shell doesn't, which is the common case while the RCL is still moving.
      - name: Cache admin publish output
        id: admin-cache
        uses: actions/cache@v4
        with:
          path: admin-publish/wwwroot
          key: admin-publish-${{ runner.os }}-dotnet-10.x-${{ hashFiles('TimPurdum.Dev.Admin/**', '!TimPurdum.Dev.Admin/bin/**', '!TimPurdum.Dev.Admin/obj/**', 'BlogGenerator/TimPurdum.Dev.BlogGenerator.Admin/**', '!BlogGenerator/TimPurdum.Dev.BlogGenerator.Admin/bin/**', '!BlogGenerator/TimPurdum.Dev.BlogGenerator.Admin/obj/**', '**/NuGet.Config') }}

      - name: Publish admin portal
        if: steps.admin-cache.outputs.cache-hit != 'true'
        run: dotnet publish TimPurdum.Dev.Admin/TimPurdum.Dev.Admin.csproj -c Release -o admin-publish

      # Staged after the public publish so it lands inside the artifact directory that gets uploaded.
      # index.html uses <base href="/admin/">, which is what makes the relative _framework/ and
      # _content/ URLs resolve against this subfolder rather than the site root.
      - name: Stage admin under /admin
        run: |
          mkdir -p ${{ env.PUBLISH_DIR }}/admin
          cp -r admin-publish/wwwroot/. ${{ env.PUBLISH_DIR }}/admin/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PUBLISH_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4